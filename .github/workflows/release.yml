name: Release

# A v* tag publishes. Manual dispatch builds the same archive without publishing, so a candidate
# can be downloaded and played before it goes out.
#
# The build itself lives in build.yml and is shared with ci.yml: this workflow only decides what
# happens to the artefact. Nothing here runs on a schedule - a workflow that published nothing yet
# appeared in the Actions list as a failed "Release" was a weekly cache warmer wearing the wrong
# name, and CI on main now keeps that cache alive by building on every push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A release cannot skip a stage: lint -> quality -> security -> build -> publish.
  gates:
    uses: ./.github/workflows/gates.yml

  build:
    needs: gates
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    # A manual dispatch is a dry run: the archive lands as a build artefact and nothing is published.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: nr-casting
          path: out

      # Curated notes: grouped conventional commits with a short brief, kept in the repo so a
      # release can be reviewed like any other change. Bump the file with the version.
      #
      # The file describes ONE version. A tag once shipped while the file still began with the
      # previous release (and the two before it), so the published body was somebody else's notes.
      # Check the file against the tag instead of trusting whoever bumped it.
      - name: The notes file is this version's notes
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          first="$(head -1 RELEASE_NOTES.md)"
          case "$first" in
            "# v${tag} "*) ;;
            *)
              echo "RELEASE_NOTES.md begins with: $first"
              echo "expected it to begin with '# v${tag} ...'"
              exit 1
              ;;
          esac
          count="$(grep -cE '^# v[0-9]+\.[0-9]+\.[0-9]+' RELEASE_NOTES.md || true)"
          if [ "$count" -ne 1 ]; then
            echo "RELEASE_NOTES.md has $count version headings; a release carries exactly one."
            grep -nE '^# v[0-9]+\.[0-9]+\.[0-9]+' RELEASE_NOTES.md || true
            exit 1
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: out/*.zip
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
