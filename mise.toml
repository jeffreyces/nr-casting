# Tools the quality gate runs, pinned per repository so CI and every machine use the same versions.
# Installed with `mise install`; the pre-push hook and CI both read this file.
[tools]
hk = "2.12.0"
gitleaks = "8.30.1"
semgrep = "1.184.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
"npm:prettier" = "3.6.2"
actionlint = "1.7.7"
zizmor = "1.9.0"
# Advisory database for the lockfiles. Installed from the crates.io pin rather than whatever a
# machine happens to have, so CI and the hook report the same findings.
"cargo:cargo-audit" = "0.22.2"

# The Rust toolchain is rustup's job (the MSVC target comes from cargo-xwin); mise only pins the
# gate's own tools so a lint result cannot depend on which machine ran it.
