[package]
name = "nr_casting"
version = "0.2.2"
edition = "2021"
publish = false

[lib]
# me3 loads this with LoadLibrary, so it has to be a DLL (output: nr_casting.dll).
crate-type = ["cdylib"]

[dependencies]
# Pure slot parsing and input routing, kept in its own crate so `cargo test` can exercise it
# without a Windows target or a running game.
nr_casting_core = { path = "pure" }
# Panel UI: Dear ImGui, rendered with D3D11 into a window of our own. The renderer crate is
# vendored because upstream compiles its two shaders with `fxc` in a build script; the vendored
# copy compiles them at runtime through d3dcompiler_47.dll instead (see
# vendor/imgui-dx11-renderer/src/runtime_shader.rs). D3D11 is the only GPU API that survived
# in-process here: Vulkan through wgpu and OpenGL through WGL both killed the game.
imgui = "0.8"
imgui-dx11-renderer = { path = "../vendor/imgui-dx11-renderer" }
windows036 = { package = "windows", version = "0.36", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }
# Win32 for the panel window: plain windows and controls, no GPU context of our own.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
# Pinned to the commit that added the ELDEN RING 2.7.2.0 (Ww2720) RVA table,
# which is what the installed exe reports. The crates.io release (0.14.0) only
# knows 2.7.1.0 and would fail version detection at load.
eldenring = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "09a4208ac26af4ae07b08c5273ee0e89faf97cb8" }
fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "09a4208ac26af4ae07b08c5273ee0e89faf97cb8" }
# Inline detour for the XInputGetState hook — the game's pad source, and the place
# R2/L2 become casts instead of heavy attack / ash of war.
retour = "0.3"

[profile.release]
# me3 injects this into a running game: keep it small and self-contained, but unwind —
# a panel bug has to die on its own thread rather than abort the host process.
panic = "unwind"
opt-level = "s"
lto = true

# The vendored copy differs from upstream in one place: an unrecognised game version falls
# back to the newest known RVA table instead of panicking, and records what it detected so
# the DLL can validate the layout and report a precise failure.
[patch."https://github.com/vswarte/fromsoftware-rs"]
eldenring = { path = "../vendor/fromsoftware-rs/crates/eldenring" }
fromsoftware-shared = { path = "../vendor/fromsoftware-rs/crates/shared" }
